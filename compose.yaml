name: self-atlas
services:
  db:
    image: postgres:17-bookworm
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "port=5432"]
    environment:
      POSTGRES_USER: atlas
      POSTGRES_DB: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - atlas-db:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    image: self-atlas-api:${RELEASE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    network_mode: host
    environment:
      DATABASE_URL: postgresql+psycopg://atlas:${POSTGRES_PASSWORD}@127.0.0.1:5432/atlas
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    read_only: true
    tmpfs: [/tmp, /data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8091/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logs
  web:
    image: self-atlas-web:${RELEASE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    network_mode: host
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8086/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logs
volumes:
  atlas-db:
